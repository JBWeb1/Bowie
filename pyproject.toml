[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docks"
version = "0.1.0"
description = "An AI coding agent for your terminal, powered by Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.15"]

[project.scripts]
docks = "docks.cli:main"

[tool.setuptools]
packages = ["docks"]
