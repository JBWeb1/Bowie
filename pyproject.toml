[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docks"
version = "1.0.0"
description = "Bowers: an AI agent that thinks, creates and builds with you."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.15"]

[project.optional-dependencies]
browser = ["playwright>=1.40"]  # the browser tool (then: playwright install chromium)
labs = ["sympy>=1.12", "pillow>=10"]  # Math Lab and Emote Maker
voice = ["kokoro-onnx>=0.4"]  # Bowie's offline voice (then: bowers voices install)
listen = ["faster-whisper>=1.0"]  # offline speech recognition for Aether in any browser

[project.scripts]
bowers = "docks.cli:main"
docks = "docks.cli:main"  # the earlier name keeps working

[tool.setuptools.packages.find]
include = ["docks*"]

[tool.setuptools.package-data]
"docks.web" = ["*.html", "app/*", "assets/*", "assets/*/*"]
"docks" = ["builtin/commands/*.md", "builtin/output-styles/*.md", "builtin/agents/*.md", "data/*.json"]
