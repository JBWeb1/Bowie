[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docks"
version = "0.1.0"
description = "An AI coding agent for your terminal, powered by Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.15"]

[project.optional-dependencies]
browser = ["playwright>=1.40"]  # the browser tool (then: playwright install chromium)

[project.scripts]
docks = "docks.cli:main"

[tool.setuptools.packages.find]
include = ["docks*"]

[tool.setuptools.package-data]
"docks.web" = ["*.html"]
"docks" = ["builtin/commands/*.md", "builtin/output-styles/*.md"]
